name: Audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for template audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate template structure
        run: python scripts/audit_template.py

      - name: gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect project type
        id: detect
        run: |
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f requirements.txt ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f package-lock.json ]; then
            echo "node_lock=npm" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "node_lock=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "node_lock=yarn" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python project dependencies
        if: steps.detect.outputs.python == 'true' && hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Ruff lint (if configured)
        if: steps.detect.outputs.python == 'true'
        run: |
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || (grep -q "\[tool.ruff\]" pyproject.toml 2>/dev/null); then
            pip install ruff
            ruff check .
            ruff check --select C90 .
          else
            echo "No ruff config found, skipping lint."
          fi

      - name: Import cycle check (if configured)
        if: steps.detect.outputs.python == 'true'
        run: |
          if [ -f .importlinter ] || (grep -q "\[importlinter\]" setup.cfg 2>/dev/null) || (grep -q "\[tool.importlinter\]" pyproject.toml 2>/dev/null); then
            pip install import-linter
            lint-imports
          else
            echo "No import-linter config found, skipping cycle check."
          fi

      - name: Python tests (if present)
        if: steps.detect.outputs.python == 'true' && hashFiles('tests/**') != ''
        run: |
          pip install pytest
          pytest -q --tb=short

      - name: Set up Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        if: steps.detect.outputs.node == 'true' && steps.detect.outputs.node_lock != ''
        run: |
          case "${{ steps.detect.outputs.node_lock }}" in
            npm) npm ci ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --immutable ;;
          esac

      - name: ESLint (if configured)
        if: steps.detect.outputs.node == 'true' && steps.detect.outputs.node_lock != ''
        run: |
          if [ -f .eslintrc.json ] || [ -f .eslintrc.js ] || [ -f .eslintrc.cjs ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            npx eslint .
          else
            echo "No ESLint config found, skipping lint."
          fi

      - name: Node tests (if present)
        if: steps.detect.outputs.node == 'true' && steps.detect.outputs.node_lock != ''
        run: npm test --if-present
